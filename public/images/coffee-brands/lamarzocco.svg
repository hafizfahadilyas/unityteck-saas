    <!-- La Marzocco wordmark -->
    <text x="74" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#18181B" letter-spacing="3">LA MARZOCCO</text>
    <text x="76" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#991B1B" letter-spacing="4">FIRENZE · 1927</text>
