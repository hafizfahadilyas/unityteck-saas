<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="ramadanBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="#0f172a"/>

  <!-- Top Bar -->
  <rect width="1200" height="42" fill="#d97706"/>
  <text x="600" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    ✨ مبارك عليكم شهر رمضان المبارك · توصيل سلات الإفطار وهدايا الحرم قبل أذان المغرب · Ramadan Kareem Edition
  </text>

  <!-- Header -->
  <rect y="42" width="1200" height="84" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
  <circle cx="90" cy="84" r="24" fill="url(#amberGold)"/>
  <text x="90" y="90" font-size="22" text-anchor="middle">🕌</text>
  <text x="126" y="78" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">هدايا مكة — إشراقة رمضان الفاخرة</text>
  <text x="126" y="96" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RAMADAN KAREEM SPIRITUAL GIFTS &amp; HAMPERS</text>

  <!-- Hero Section -->
  <g filter="url(#shadow)">
    <rect x="50" y="150" width="1100" height="380" rx="28" fill="url(#ramadanBg)" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="220" fill="url(#amberGold)" font-family="system-ui, sans-serif" font-size="16" font-weight="900">✨ نفحات رمضانية روحانية مباركة</text>
    <text x="100" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900">سلات إفطار الصائم وهدايا الحرم المكي</text>
    <text x="100" y="320" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">باقات الورد الأبيض، التمور الفاخرة، والعود الملكي مع توصيل مباشر لفنادق مكة</text>
    
    <rect x="100" y="365" width="200" height="48" rx="24" fill="url(#amberGold)"/>
    <text x="200" y="395" fill="#1e1b4b" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">تسوق باقات رمضان 🌙</text>

    <!-- Fanoos 3D Visual Box -->
    <rect x="760" y="190" width="340" height="300" rx="20" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2"/>
    <text x="930" y="320" font-size="64" text-anchor="middle">🏮🕌✨</text>
    <text x="930" y="420" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">سلة الحرم الرمضانية · ٣٥٠ ر.س</text>
  </g>
</svg>
