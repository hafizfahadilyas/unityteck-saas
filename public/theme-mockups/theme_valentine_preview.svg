<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="valBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="#1c050c"/>

  <!-- Announcement Bar -->
  <rect width="1200" height="42" fill="#be123c"/>
  <text x="600" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    ❤️ باقات الحب والرومانسية الفاخرة · ورد هولندي أحمر طبيعي مع بطاقات إهداء مخصصة · Romantic Floral Luxe
  </text>

  <!-- Store Header -->
  <rect y="42" width="1200" height="84" fill="#2c0b14" stroke="#4c0519" stroke-width="1"/>
  <circle cx="90" cy="84" r="24" fill="url(#roseGold)"/>
  <text x="90" y="90" font-size="20" text-anchor="middle">🌹</text>
  <text x="126" y="78" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">هدايا مكة — روعة الورد الأحمر</text>
  <text x="126" y="96" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ROMANTIC LUXURY FLOWERS &amp; CHOCOLATE</text>

  <!-- Hero Section -->
  <g filter="url(#shadow)">
    <rect x="50" y="150" width="1100" height="380" rx="28" fill="url(#valBg)" stroke="#fb7185" stroke-width="2"/>
    <text x="100" y="220" fill="url(#roseGold)" font-family="system-ui, sans-serif" font-size="16" font-weight="900">❤️ الورد الأحمر الهولندي الأصيل قطف يومي</text>
    <text x="100" y="280" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="900">أرقى باقات الرومانسية والمناسبات الخاصة</text>
    <text x="100" y="320" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="16">تنسيقات ملكية استثنائية من ١٠٠ وردة جورية مع أرقى أنواع الشوكولاتة والعطور</text>
    
    <rect x="100" y="365" width="220" height="48" rx="24" fill="url(#roseGold)"/>
    <text x="210" y="395" fill="#881337" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">اختر باقة الحب 🌹</text>

    <!-- Visual 3D Preview Box -->
    <rect x="760" y="190" width="340" height="300" rx="20" fill="#4c0519" stroke="#fb7185" stroke-width="2"/>
    <text x="930" y="320" font-size="64" text-anchor="middle">🌹💐❤️</text>
    <text x="930" y="420" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">باقة العشق الأبدي · ٣٩٩ ر.س</text>
  </g>
</svg>
