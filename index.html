    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' ? window.fetch : null;
          var _currentFetch = _origFetch;
          
          // Make window.fetch writable with getter and setter
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(val) {
                _currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {}

          // Also patch Window.prototype if applicable
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(val) {
                  _currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}

          // Also patch globalThis if distinct
          try {
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(val) {
                  _currentFetch = val;
                },

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('unityteck_prefs');
          if (!raw) return;
          var p = JSON.parse(raw);
          var root = document.documentElement;
          if (p.locale === 'ar' || p.locale === 'ur') {
            root.setAttribute('dir', 'rtl');
            root.setAttribute('lang', p.locale);
          } else {
            root.setAttribute('dir', 'ltr');
            root.setAttribute('lang', 'en');
          }
          if (p.theme === 'dark' || p.theme === 'light') {
            root.setAttribute('data-theme', p.theme);
          }
          if (p.brand && p.brand.font) {
            root.setAttribute('data-font', p.brand.font);
          }
          if (p.brand && p.brand.palette) {
            root.setAttribute('data-brand', p.brand.palette);
          }
        } catch (e) {}
      })();
    </script>
